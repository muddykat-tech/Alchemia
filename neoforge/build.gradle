plugins {
    id 'net.neoforged.moddev' version '2.0.147'
}

neoForge {
    version = gradle.ext.mcProps.getProperty('neo_version')

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        clientData {
            clientData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file("src/generated/${mc_version}/client").absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }
        serverData {
            serverData()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file("src/generated/${mc_version}/server").absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = file("run/${mc_version}")
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    def generated = file("src/generated/${mc_version}")
    if (generated.exists()) {
        srcDir new File(generated, 'client')
        srcDir new File(generated, 'server')
        exclude '**/.cache'
    }
    def overlay = file("src/main/resources-${mc_version}")
    if (overlay.exists()) srcDir overlay
}

dependencies {
    annotationProcessor "systems.manifold:manifold-preprocessor:${manifold_version}"
    compileOnly "systems.manifold:manifold-preprocessor:${manifold_version}"

    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    def farmersDelight = gradle.ext.mcProps.getProperty('farmers_delight_file')
    if (farmersDelight) runtimeOnly "curse.maven:farmers-delight-26-neo-ver-1699768:${farmersDelight}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            neo_version            : gradle.ext.mcProps.getProperty('neo_version'),
            neo_version_range      : gradle.ext.mcProps.getProperty('neo_version_range'),
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            logo_properties        : (mc_ordinal as int) >= 26200
                    ? 'iconFile="logo.png"\niconBlur=false'
                    : 'logoFile="logo.png"\nlogoBlur=false',
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('runData') {
    group = 'neoforged runs'
    description = 'Runs both the client and server data generators.'
    dependsOn 'runClientData', 'runServerData'
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xplugin:Manifold']
}
