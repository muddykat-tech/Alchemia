plugins {
    id 'idea'
}

def mcProps = gradle.ext.mcProps
def activeMc = gradle.ext.activeMc

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'idea'

    group = mod_group_id
    version = "${mcProps.getProperty('mc_version')}-${mod_version}"

    ext {
        mc_version = mcProps.getProperty('mc_version')
        mc_version_range = mcProps.getProperty('mc_version_range')
        mc_symbol = mcProps.getProperty('mc_symbol')
        mc_ordinal = mcProps.getProperty('mc_ordinal')
        loader = mcProps.getProperty('loader')
        java_version = mcProps.getProperty('java_version') as int
        jei_version = mcProps.getProperty('jei_version')
        commonRoot = rootProject.file('common')

        preprocessorSymbols = [
                (mcProps.getProperty('mc_symbol'))           : 'true',
                MC_VER                                       : mcProps.getProperty('mc_ordinal'),
                (mcProps.getProperty('loader').toUpperCase()): 'true',
        ]
    }

    base {
        archivesName = "${mod_id}-${loader}"
    }

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    repositories {
        mavenCentral()
        maven {
            name = 'Jared'
            url = 'https://maven.blamejared.com/'
            content {
                includeGroup 'mezz.jei'
                includeGroupByRegex 'net\\.mezzdev.*'
            }
        }
        maven {
            name = 'CurseMaven'
            url = 'https://cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }
    }

    def commonJava = new File(commonRoot, 'src/main/java')
    def moduleJava = file('src/main/java')

    sourceSets.main.java {
        srcDir commonJava
    }

    tasks.named('compileJava') {
        def overridden = fileTree(moduleJava) { include '**/*.java' }.files.collect {
            moduleJava.toPath().relativize(it.toPath()).toString()
        }
        source = fileTree(moduleJava) { include '**/*.java' } +
                fileTree(commonJava) { include '**/*.java'; exclude overridden }
    }

    sourceSets.main.resources.srcDirs = [new File(commonRoot, 'src/main/resources'), file('src/main/resources')]

    tasks.named('processResources') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }

    tasks.withType(JavaCompile).configureEach {
        preprocessorSymbols.each { k, v -> options.compilerArgs += "-A${k}=${v}" }
    }

    tasks.register('generatePreprocessorSymbols') {
        def out = layout.buildDirectory.file('preprocessor/manifold.properties')
        def symbols = preprocessorSymbols
        inputs.properties symbols
        outputs.file out
        doLast {
            def f = out.get().asFile
            f.parentFile.mkdirs()
            f.text = symbols.collect { k, v -> "${k}=${v}" }.join('\n') + '\n'
        }
    }
}

tasks.register('targets') {
    group = 'alchemia'
    description = 'Lists every buildable Minecraft target.'
    doLast {
        println "Active: ${activeMc}"
        println 'Available targets (select with -Pmc=<version>):'
        gradle.ext.allTargets.each { println "  - ${it}" }
    }
}
