name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: '1.20.1'
            java: '17'
            module: forge
          - mc: '26.1.2'
            java: '25'
            module: neoforge
          - mc: '26.2'
            java: '25'
            module: neoforge

    name: ${{ matrix.module }} ${{ matrix.mc }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mc }}
        run: ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alchemia-${{ matrix.module }}-${{ matrix.mc }}
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
