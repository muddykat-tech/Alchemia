plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.146'
}

legacyForge {
    version = "${gradle.ext.mcProps.getProperty('mc_version')}-${gradle.ext.mcProps.getProperty('forge_version')}"

    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', file("src/generated/${mc_version}/resources").absolutePath,
                    '--existing', rootProject.file('common/src/main/resources').absolutePath
        }
        configureEach {
            gameDirectory = file("run/${mc_version}")
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    def generated = file("src/generated/${mc_version}/resources")
    if (generated.exists()) {
        srcDir generated
        exclude '**/.cache'
    }
}

dependencies {
    annotationProcessor "systems.manifold:manifold-preprocessor:${manifold_version}"
    compileOnly "systems.manifold:manifold-preprocessor:${manifold_version}"

    compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    modRuntimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version      : mc_version,
            minecraft_version_range: mc_version_range,
            forge_version          : gradle.ext.mcProps.getProperty('forge_version'),
            forge_version_range    : gradle.ext.mcProps.getProperty('forge_version_range'),
            loader_version_range   : gradle.ext.mcProps.getProperty('loader_version_range'),
            pack_format            : gradle.ext.mcProps.getProperty('pack_format'),
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
legacyForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xplugin:Manifold']
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
        ])
    }
}
